# Netlify Configuration for Phasebook Full-Stack Application

[build]
  # The React/Vite application lives in web/; the repository root hosts the
  # Python sample that BugLens indexes.
  base = "web"
  publish = "dist"
  command = "npm run build"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  # Netlify treats every environment-variable value as a secret and greps for
  # it in the repo and build output. These three values are ordinary defaults
  # ("main", the public PagerDuty endpoint, "production"), so exclude the keys
  # from scanning instead of disabling scanning. Real secrets stay scanned.
  SECRETS_SCAN_OMIT_KEYS = "GITHUB_BRANCH,PAGERDUTY_API_URL,NODE_ENV"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["pg"]

# Route all /api/* requests to the Netlify Serverless Function wrapper
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# Explicit redirect for legacy root /health/database endpoint
[[redirects]]
  from = "/health/database"
  to = "/.netlify/functions/api/health/database"
  status = 200

# Prevent direct static downloading of Node container entrypoint bundle
[[redirects]]
  from = "/server.cjs*"
  to = "/index.html"
  status = 404

# SPA Client-Side Routing: Route all page requests to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
