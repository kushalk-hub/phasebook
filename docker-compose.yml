version: '3.8'

services:
  # Backend API & Gateway Service (Connected to Neon Serverless Postgres)
  phasebook-api:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: phasebook-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL}
      NEON_API_KEY: ${NEON_API_KEY}
      GITHUB_REPOSITORY: ${GITHUB_REPOSITORY}
      GITHUB_BRANCH: ${GITHUB_BRANCH:-main}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      PAGERDUTY_INTEGRATION_KEY: ${PAGERDUTY_INTEGRATION_KEY}
    networks:
      - phasebook-network

  # Web Frontend (Served via API or standalone reverse proxy)
  phasebook-web:
    image: nginx:alpine
    container_name: phasebook-web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - phasebook-api
    networks:
      - phasebook-network

  # Mock Payment Gateway Dependency (External third-party API)
  phasebook-payment-mock:
    image: node:20-alpine
    container_name: phasebook-payment-mock
    restart: unless-stopped
    ports:
      - "8084:8084"
    command: >
      node -e '
        const http = require("http");
        http.createServer((req, res) => {
          if (req.url === "/health") {
            res.writeHead(200, { "Content-Type": "application/json" });
            res.end(JSON.stringify({ status: "UP", provider: "Mock Payment Gateway" }));
          } else {
            res.writeHead(200, { "Content-Type": "application/json" });
            res.end(JSON.stringify({ status: "AUTHORIZED", txn: "mock_" + Date.now() }));
          }
        }).listen(8084, () => console.log("Mock Payment Service listening on 8084"));
      '
    networks:
      - phasebook-network

  # Telemetry & Monitoring Service
  phasebook-monitoring:
    image: prom/prometheus:v2.50.0
    container_name: phasebook-monitoring
    restart: unless-stopped
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    volumes:
      - ./web/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - phasebook-network

  # SRE-Zero Autonomous Remediation Agent Container
  phasebook-sre-zero:
    image: alpine:latest
    container_name: phasebook-sre-zero
    restart: unless-stopped
    command: >
      sh -c '
        echo "[SRE-Zero] Agent initialized. Monitoring Phasebook telemetry stream...";
        while true; do
          sleep 10;
        done
      '
    networks:
      - phasebook-network

networks:
  phasebook-network:
    driver: bridge
